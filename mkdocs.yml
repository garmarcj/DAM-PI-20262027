site_name: Proyecto intermodular I de DAM
site_url: https://garmarcj.github.io/DAM-PI-20262027/
site_author: Cristian Garcia
theme:
  name: material
  language: es
  palette:
    scheme: default
    primary: green
  features:
    - navigation.instant
    - navigation.top
    - navigation.sections
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
nav:
  - Inicio: index.md
  - Unidad 1: unidad1.md
  - Unidad 2: unidad2.md
  - Unidad 3: unidad3.md

extra_javascript:
  - https://unpkg.com
markdown_extensions:
  - admonition
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
plugins:
  - with-pdf:
      output_path: pdf/proyectointermodular.pdf
      cover: true
      toc_title: "proyectointermodular"
      exclude_pages:
        - licencia.md